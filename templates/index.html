<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA Perso - Vision & Mémoire</title>
    <style>
        :root {
            --sidebar-bg: #202123;
            --main-bg: #343541;
            --input-bg: #40414f;
            --accent: #10a37f;
            --user-msg: #0b93f6;
        }

        body { font-family: 'Sego UI', sans-serif; background: var(--main-bg); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Barre latérale */
        #sidebar {
            width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column;
            padding: 10px; transition: all 0.3s ease; border-right: 1px solid #4d4d4f;
        }
        .nav-btn {
            background: transparent; border: 1px solid #565869; color: white; padding: 12px;
            border-radius: 5px; cursor: pointer; text-align: left; margin-bottom: 20px; transition: 0.2s;
        }
        .nav-btn:hover { background: #2a2b32; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px; border-radius: 5px; cursor: pointer; font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: #2a2b32; }

        /* Zone de Chat */
        #chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        
        .message { max-width: 80%; padding: 15px; border-radius: 10px; margin-bottom: 20px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--user-msg); margin-left: auto; border-bottom-right-radius: 2px; }
        .assistant { align-self: flex-start; background: #444654; border-bottom-left-radius: 2px; }
        
        /* Zone d'entrée */
        #input-wrapper { background: var(--main-bg); padding: 20px; border-top: 1px solid #4d4d4f; }
        #input-box {
            max-width: 800px; margin: 0 auto; background: var(--input-bg); padding: 10px;
            border-radius: 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        input[type="text"] { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 16px; }
        
        .action-btn { background: transparent; border: none; color: #acacbe; cursor: pointer; font-size: 20px; padding: 5px; transition: 0.2s; }
        .action-btn:hover { color: white; }
        #send-btn { color: var(--accent); }
        
        /* Preview Image */
        #image-preview { display: none; padding: 10px; background: #2a2b32; border-radius: 5px; margin-bottom: 10px; position: relative; }
        #preview-img { height: 50px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <button class="nav-btn" onclick="location.reload()">+ Nouveau Chat</button>
    <div style="font-size: 12px; color: #8e8ea0; margin-bottom: 10px;">HISTORIQUE RÉCENT</div>
    <div id="history-list">
        <!-- Les titres des chats s'ajouteront ici -->
    </div>
</div>

<div id="chat-area">
    <div id="chat-container">
        <div class="message assistant">Bonjour ! Je suis ton assistant IA. Je peux analyser tes images et me souvenir de notre discussion. Comment puis-je t'aider ?</div>
    </div>

    <div id="input-wrapper">
        <div id="image-preview">
            <img id="preview-img" src="">
            <button onclick="clearImage()" style="position:absolute; top:0; right:0; background:red; color:white; border:none; border-radius:50%; cursor:pointer;">×</button>
        </div>
        
        <div id="input-box">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewImage(this)">
            <button class="action-btn" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="text" id="user-input" placeholder="Envoyez un message..." autocomplete="off">
            <button class="action-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const fileInput = document.getElementById('file-input');
    const historyList = document.getElementById('history-list');

    // Charger l'historique visuel depuis le stockage local du navigateur
    function loadHistory() {
        const saved = JSON.parse(localStorage.getItem('ai_history') || '[]');
        historyList.innerHTML = saved.map(title => `<div class="history-item">💬 ${title}</div>`).join('');
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('image-preview').style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clearImage() {
        fileInput.value = "";
        document.getElementById('image-preview').style.display = 'none';
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const file = fileInput.files[0];
        if (!text && !file) return;

        // UI : Ajouter le message utilisateur
        addMessage('user', text || "Image envoyée");
        if (text && chatContainer.children.length <= 3) {
            saveTitleToHistory(text);
        }

        const formData = new FormData();
        formData.append('message', text);
        if (file) formData.append('image', file);

        // Reset inputs
        userInput.value = "";
        clearImage();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            addMessage('assistant', data.response || "Désolé, une erreur est survenue.");
        } catch (e) {
            addMessage('assistant', "Erreur de connexion au serveur Render.");
        }
    }

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerText = content;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function saveTitleToHistory(text) {
        let history = JSON.parse(localStorage.getItem('ai_history') || '[]');
        const title = text.substring(0, 30) + "...";
        history.unshift(title);
        localStorage.setItem('ai_history', JSON.stringify(history.slice(0, 10)));
        loadHistory();
    }

    userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
    loadHistory();
</script>

</body>
</html>
